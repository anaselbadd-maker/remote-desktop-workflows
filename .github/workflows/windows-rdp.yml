name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""

          $out = Join-Path $PWD "tunnel.out"
          $err = Join-Path $PWD "tunnel.err"

          Start-Process -FilePath "cloudflared.exe" `
            -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate" `
            -RedirectStandardOutput $out `
            -RedirectStandardError  $err `
            -NoNewWindow

          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $m = Select-String -Path $err,$out `
                   -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' `
                   -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            if ($m) { $url = $m.Matches[0].Value; break }
          }

          if (-not $url) {
            Write-Host "❌ Could not extract tunnel URL. Full cloudflared log:"
            Get-Content $err,$out -ErrorAction SilentlyContinue
            exit 1
          }

          $host_ = $url -replace '^https://',''

          Write-Host ""
          Write-Host "🌐 TUNNEL URL : $url"
          Write-Host "🌐 HOSTNAME   : $host_"
          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "   OS: Windows Server 2022"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "On your PC run:"
          Write-Host "   cloudflared access tcp --hostname $host_ --url localhost:3389"
          Write-Host "Then open mstsc and connect to localhost:3389"
          Write-Host ""

          "## 🌐 Tunnel URL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``$url``"         | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "### Client command" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````"           | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "cloudflared access tcp --hostname $host_ --url localhost:3389" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````"           | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Then open ``mstsc`` and connect to ``localhost:3389`` as ``runneradmin`` / ``P@ssw0rd123!``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
