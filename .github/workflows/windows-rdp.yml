name: macOS VNC - CLOUDFLARE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          brew install cloudflare/cloudflare/cloudflared
          echo "✅ Cloudflared Installed!"

      - name: Enable VNC/Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          echo "✅ VNC Enabled!"

      - name: Set VNC Password (Legacy VNC)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Library/Preferences

          # Set legacy VNC password via kickstart
          echo "P@ssw0rd123!" | sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw P@ssw0rd123!

          # Also write the MD5 hash directly into the plist (more reliable on newer macOS)
          HASH=$(md5 -q -s "P@ssw0rd123!")
          ENCODED=$(printf '%s' "$HASH" | xxd -r -p | base64)

          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords array" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null || true
          sudo /usr/libexec/PlistBuddy -c "Delete :VNCLegacyPasswords:0" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null || true
          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords:0 data $ENCODED" /Library/Preferences/com.apple.RemoteManagement.plist

          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          echo "✅ VNC Password Set!"

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          echo "============================================"
          echo "🚀 macOS VNC - CLOUDFLARE TUNNEL"
          echo "============================================"
          echo ""

          cloudflared tunnel --url tcp://localhost:5900 --no-autoupdate > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            sleep 2
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
          done

          if [ -z "$URL" ]; then
            echo "❌ Could not extract tunnel URL. Full log:"
            cat tunnel.log
            exit 1
          fi

          HOST=${URL#https://}

          echo ""
          echo "🌐 TUNNEL URL : $URL"
          echo "🌐 HOSTNAME   : $HOST"
          echo ""
          echo "📋 CONNECTION DETAILS:"
          echo "   PASSWORD: P@ssw0rd123!"
          echo "   OS: macOS Monterey/Ventura"
          echo "   Architecture: $(uname -m)"
          echo "============================================"
          echo ""
          echo "On your PC run:"
          echo "   cloudflared access tcp --hostname $HOST --url localhost:5900"
          echo "Then connect with a VNC viewer to localhost:5900"
          echo ""

          echo "## 🌐 Tunnel URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Client command" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "cloudflared access tcp --hostname $HOST --url localhost:5900" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Then open a VNC viewer to \`localhost:5900\`, password \`P@ssw0rd123!\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Session Alive
        run: |
          echo "⏳ Session Active - Keeping alive..."
          while true; do
            sleep 60
            echo "✓ Active - $(date '+%H:%M:%S')"
          done
