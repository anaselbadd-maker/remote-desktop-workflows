name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub caps hosted runners at 6h anyway

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""

          $out = Join-Path $PWD "tunnel.out"
          $err = Join-Path $PWD "tunnel.err"

          # Run cloudflared in THIS window (no detached PowerShell) and log to files
          Start-Process -FilePath "cloudflared.exe" `
            -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate" `
            -RedirectStandardOutput $out `
            -RedirectStandardError  $err `
            -NoNewWindow

          # Poll the logs until the trycloudflare URL shows up
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $m = Select-String -Path $err,$out `
                   -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' `
                   -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            if ($m) { $url = $m.Matches[0].Value; break }
          }

          if (-not $url) {
            Write-Host "❌ Could not extract tunnel URL. Full cloudflared log:"
            Get-Content $err,$out -ErrorAction SilentlyContinue
            exit 1
          }

          $host_ = $url -replace '^https://',''

          Write-Host ""
          Write-Host "🌐 TUNNEL URL : $url"
          Write-Host "🌐 HOSTNAME   : $host_"
          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "   OS: Windows Server 2022"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "On your PC run:"
          Write-Host "   cloudflared access tcp --hostname $host_ --url localhost:3389"
          Write-Host "Then open mstsc and connect to localhost:3389"
          Write-Host ""

          # Put the URL in big text at the top of the run page
          $summary = @"
## 🌐 Tunnel URL

``$url``

### Client command

cloudflared access tcp --hostname $host_ --url localhost:3389


Then RDP to ``localhost:3389`` as ``runneradmin`` / ``P@ssw0rd123!``
"@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
```

## What changed vs. your file

| Line | Before | After |
|---|---|---|
| Tunnel launch | `Start-Process PowerShell -ArgumentList '-NoExit -Command "cloudflared ..."'` → invisible detached window | `Start-Process cloudflared.exe -NoNewWindow -RedirectStandard{Out,Err}` → logs land in `tunnel.out` / `tunnel.err` |
| URL discovery | none | Polls the log files for `https://*.trycloudflare.com` for up to 60 s, fails loudly if not found (and dumps the log) |
| Output | "Check separate PowerShell window" | Prints URL + hostname + the exact `cloudflared access tcp` command you need |
| Run page | nothing | Writes the URL into `$GITHUB_STEP_SUMMARY` → appears in bold at the top of the run page |
| `timeout-minutes` | `9999` | `360` (GitHub silently clamps to 6 h anyway) |
| `on:` | `on: workflow_dispatch` | `on:\n  workflow_dispatch:` (explicit map, no parsing surprises) |

## After you commit and re-run

1. Open the run → the URL is **at the top of the page** under "Summary", and also in the `Start Cloudflare Tunnel` step log right after `🌐 TUNNEL URL :`.
2. On your own Windows PC (with `cloudflared` installed), copy the exact command the log prints, e.g.:
   ```
   cloudflared access tcp --hostname random-words-here.trycloudflare.com --url localhost:3389
   ```
   ⚠️ **Use the hostname without `https://`** — `--hostname` wants the bare host.
3. Leave that terminal open, then `Win+R` → `mstsc` → Computer `localhost:3389` → user `runneradmin`, pass `P@ssw0rd123!`.

## Two things to be aware of (not bugs in your file, but gotchas)

- **Quick tunnels (`trycloudflare.com`) are HTTP-oriented by design.** `cloudflared tunnel --url tcp://localhost:3389` + `cloudflared access tcp` generally works because the client speaks the tunnel protocol directly, but Cloudflare doesn't guarantee TCP on quick tunnels and occasionally it breaks/changes. If the client says "connection refused" even though the URL resolved, that's the usual suspect — the fix is a named tunnel with your own domain, which this README explicitly avoids.
- **The `Keep Session Alive` step never returns**, so the job runs until GitHub's 6-hour cap kills it. That's intended, just don't expect a green "completed" status — it'll end as *cancelled*.

If you hit any error in the new step, paste the `tunnel.err` contents (it's dumped automatically on failure) and I'll adjust.
